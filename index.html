<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tavolo da Burraco</title>
<meta name="description" content="Burraco italiano gratuito contro il computer, uno contro uno o a coppie, con le regole ufficiali. Funziona anche senza connessione.">
<meta name="theme-color" content="#14241D">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=Archivo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="wrap">
  <div class="layout" id="layout" hidden>
    <main class="panel board" id="board"></main>
  </div>
  <div class="home" id="home"></div>
</div>

<div id="overlay"></div>

<script type="module" src="./src/ui.js"></script>
<script>
// Registrazione del service worker: l'app resta giocabile anche offline.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => { /* niente offline, pazienza */ });
  });
}
</script>
</body>
</html>
