name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  motore:
    name: Regole del gioco
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: burraco-webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
